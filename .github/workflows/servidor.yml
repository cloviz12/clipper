name: Motor para servidor (Docker)

on:
  pull_request:
    paths: ["worker/**", "servidor/**", ".github/workflows/servidor.yml"]
  workflow_dispatch:

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Construir para servidores x86 y ARM (Oracle Ampere)
        uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/amd64,linux/arm64
          push: false
          tags: clipper-motor:prueba
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Probar que el motor carga todo
        run: |
          docker buildx build --load -t clipper-motor:local worker
          docker run --rm clipper-motor:local python -c "import main, cv2, faster_whisper, streamlink, yt_dlp; from clipper import editor, en_vivo, efectos; efectos.fabricar_base(); import shutil; assert shutil.which('ffmpeg') and shutil.which('deno'); print('MOTOR OK')"
