name: App de escritorio (Windows)

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -notmatch '^v\d') { $v = "1.0.0-pr${{ github.run_number }}" } else { $v = $v.Substring(1) }
          "version=$v" >> $env:GITHUB_OUTPUT
          (Get-Content app/clipper_app.py) -replace 'VERSION = ".*"', "VERSION = `"$v`"" | Set-Content app/clipper_app.py -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Interfaz
        working-directory: ui
        run: |
          npm ci
          npx next build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            app/requirements.txt

      - name: Librerias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt -r app/requirements.txt pyinstaller

      - name: ffmpeg y deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/bin | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Get-ChildItem ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination app/bin
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath app/bin
          Get-ChildItem app/bin

      - name: Empaquetar
        working-directory: app
        run: pyinstaller clipper.spec --noconfirm --clean

      - name: Probar que el programa trae todo
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\prueba"
          $p = Start-Process app/dist/CLIPPER/CLIPPER.exe -ArgumentList "--prueba" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\prueba\CLIPPER\clipper.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "La prueba del programa fallo ($($p.ExitCode))" }

      - name: Instalador
        working-directory: app
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          } else { $iscc = "iscc" }
          & $iscc "/DVersion=${{ steps.v.outputs.version }}" instalador.iss
          Get-ChildItem salida

      - uses: actions/upload-artifact@v4
        with:
          name: CLIPPER-Setup-${{ steps.v.outputs.version }}
          path: app/salida/*.exe
          retention-days: 14

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/salida/*.exe
          generate_release_notes: true
